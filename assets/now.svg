<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-label="Now building: Git as the home of the lab's brain; Nexus, one screen for everything my AI assistants are doing; a dictation app for Mac and Android." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#140829"/>
      <stop offset="1" stop-color="#1d0c3a"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif}
      .dot{animation:p 2.4s ease-in-out infinite}
      .d2{animation-delay:.8s}.d3{animation-delay:1.6s}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
      .bar{animation:grow 3.5s ease-in-out infinite alternate}
      @keyframes grow{from{opacity:.55}to{opacity:1}}
      @media (prefers-reduced-motion: reduce){.dot,.bar{animation:none}}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1279" height="249" rx="18" fill="url(#bg)" stroke="#42f5ef" stroke-opacity="0.2"/>
  <g class="t">
    <text x="48" y="58" fill="#42f5ef" font-size="15" font-weight="600" letter-spacing="4">NOW BUILDING</text>

    <circle class="dot" cx="58" cy="104" r="6" fill="#42f5ef"/>
    <text x="80" y="111" fill="#f4f0ff" font-size="22" font-weight="600">The lab's brain moves into Git</text>
    <text x="440" y="111" fill="#b9a8dc" font-size="18">one home for every rule, skill and handoff the assistants share</text>

    <circle class="dot d2" cx="58" cy="152" r="6" fill="#42f5ef"/>
    <text x="80" y="159" fill="#f4f0ff" font-size="22" font-weight="600">Nexus</text>
    <text x="440" y="159" fill="#b9a8dc" font-size="18">one screen for everything my AI assistants are doing</text>

    <circle class="dot d3" cx="58" cy="200" r="6" fill="#42f5ef"/>
    <text x="80" y="207" fill="#f4f0ff" font-size="22" font-weight="600">A dictation app</text>
    <text x="440" y="207" fill="#b9a8dc" font-size="18">for Mac and Android, so I can talk instead of type</text>
  </g>
  <rect class="bar" x="1180" y="40" width="52" height="6" rx="3" fill="#7b2ff7"/>
  <rect class="bar" x="1206" y="54" width="26" height="6" rx="3" fill="#42f5ef"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
